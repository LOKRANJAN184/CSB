name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Prepare APK Release Artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Chendurar-Bakery.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chendurar-Bakery-App
          path: Chendurar-Bakery.apk
          if-no-files-found: error

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Chendurar-Bakery.apk
          name: Release ${{ github.ref_name }}
          body: |
            ## Chendurar Sweets & Bakery - Mobile App (${{ github.ref_name }})
            
            ### What's New:
            - Crisp SVG Icon System (No Emojis)
            - Full Dark Mode Theme Support
            - In-App Automated APK Updates
            - Modern intuitive dashboard & reporting UI
            
            **Download:** Download and install `Chendurar-Bakery.apk` below.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
