<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets us paint under the phone's notch/gesture bar; we pad with env(safe-area-inset-*) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f3">
  <meta name="color-scheme" content="light dark">
  <title>Chendurar Sweets & Bakery</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="images/logo.png">
  <link rel="preload" href="fonts/AnekTamil-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <!-- Apply the saved theme before first paint, so dark-mode users never see a white flash -->
  <script>
    try { var t = localStorage.getItem('csb.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <div class="login"><p class="muted">Loading…</p></div>
  </div>
  <noscript>This app needs JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
